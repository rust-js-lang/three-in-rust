name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'build/**'
      - 'docs/**'
      - 'files/**'

permissions:
  contents: read

jobs:
  test:
    name: Lint, Unit, Unit addons, Circular dependencies & Examples testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chrome
        run: bun --bun puppeteer browsers install chrome

      - name: === Lint testing ===
        run: bun run lint

      - name: === Unit testing ===
        run: bun run test-unit

      - name: === Unit addons testing ===
        run: bun run test-unit-addons

      - name: === Examples ready for release ===
        run: bun run test-e2e-cov

      - name: === Tree-shaking ===
        run: bun run test-treeshake

  e2e:
    name: E2E testing
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        CI: [ 0, 1, 2, 3, 4 ]
    env:
      CI: ${{ matrix.CI }}
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install Vulkan drivers and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers xvfb
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chrome
        run: bun --bun puppeteer browsers install chrome
      - name: Build
        run: bun run build

      - name: === E2E testing ===
        run: xvfb-run -a bun run test-e2e
      - name: Upload output screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: Output screenshots-${{ matrix.os }}-${{ matrix.CI }}
          path: test/e2e/output-screenshots
          if-no-files-found: ignore
